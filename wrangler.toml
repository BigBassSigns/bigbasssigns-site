name = "muddy-wind-ead0"
compatibility_date = "2026-09-01"
main = "worker.js"

routes = [
  { pattern = "bigbasssigns.com/*", zone_name = "bigbasssigns.com" },
  { pattern = "www.bigbasssigns.com/*", zone_name = "bigbasssigns.com" }
]

[assets]
directory = "."
binding = "ASSETS"
html_handling = "auto-trailing-slash"
not_found_handling = "404-page"
run_worker_first = ["/robots.txt", "/sitemap.xml"]
